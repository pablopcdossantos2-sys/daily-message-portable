name: build-msix

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Verify WinRT APIs used by the MSIX app
        run: python -c "from winrt.windows.applicationmodel import StartupTask; from winrt.windows.storage import ApplicationData; print('WinRT OK')"
      - run: python -m pytest -q
      - name: Build MSIX
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: |
          $identity = if ($env:MSIX_IDENTITY_NAME) { $env:MSIX_IDENTITY_NAME } else { "Publisher.DailyMessage" }
          $publisher = if ($env:MSIX_PUBLISHER) { $env:MSIX_PUBLISHER } else { "CN=Publisher" }
          $publisherDisplay = if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $env:MSIX_PUBLISHER_DISPLAY_NAME } else { "Publisher" }
          $display = if ($env:MSIX_DISPLAY_NAME) { $env:MSIX_DISPLAY_NAME } else { "Daily Message" }
          ./packaging/build.ps1 -IdentityName $identity -Publisher $publisher -PublisherDisplayName $publisherDisplay -DisplayName $display -SignTest
      - name: Install and validate the signed MSIX package
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
        run: |
          $identity = if ($env:MSIX_IDENTITY_NAME) { $env:MSIX_IDENTITY_NAME } else { "Publisher.DailyMessage" }
          ./packaging/validate_msix.ps1 -MsixPath "release/DailyMessage-validation.msix" -IdentityName $identity
      - name: Upload Store-ready MSIX
        if: ${{ vars.MSIX_IDENTITY_NAME != '' && vars.MSIX_PUBLISHER != '' && vars.MSIX_PUBLISHER_DISPLAY_NAME != '' && vars.MSIX_DISPLAY_NAME != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: DailyMessage-MSIX-STORE
          path: release/DailyMessage_*.msix
      - name: Upload validation-only MSIX (Partner Center identity is missing)
        if: ${{ vars.MSIX_IDENTITY_NAME == '' || vars.MSIX_PUBLISHER == '' || vars.MSIX_PUBLISHER_DISPLAY_NAME == '' || vars.MSIX_DISPLAY_NAME == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: DailyMessage-MSIX-VALIDATION-ONLY
          path: release/DailyMessage_*.msix
      - name: Publish GitHub release asset
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.msix
